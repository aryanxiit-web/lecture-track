<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecture Register — Weekly Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#eef1f5">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lec Tracker">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #eef1f5;
    --surface: #ffffff;
    --surface-2: #f3f5f8;
    --surface-3: #e7ebf0;
    --border: #dde3ea;
    --border-soft: #e8ecf1;
    --border-hour: #cdd5de;
    --text: #1b2430;
    --text-dim: #5c6673;
    --text-faint: #98a1ac;

    --physics: #2f7ed8;
    --physics-dim: rgba(47,126,216,0.12);
    --chemistry: #7c5cf0;
    --chemistry-dim: rgba(124,92,240,0.12);
    --maths: #0aa39a;
    --maths-dim: rgba(10,163,154,0.12);

    --danger: #dc2f35;
    --danger-dim: rgba(220,47,53,0.10);
    --due: #d97706;
    --success: #12a875;
    --success-dim: rgba(18,168,117,0.10);

    --ease: cubic-bezier(.16,1,.3,1);
    --ease-pop: cubic-bezier(.34,1.56,.64,1);
    --flip-duration: 480ms;
  }

  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body{ min-height:100vh; padding: 28px 24px 60px; }
  button{ position:relative; overflow:hidden; -webkit-tap-highlight-color:transparent; font-family:inherit; }

  /* ---------- Ambient background ---------- */
  .bg-aurora{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .bg-aurora span{ position:absolute; border-radius:50%; filter: blur(100px); opacity:0.07; }
  .bg-aurora span:nth-child(1){ width:520px; height:520px; background:var(--physics); top:-160px; left:-120px; animation: drift1 26s ease-in-out infinite alternate; }
  .bg-aurora span:nth-child(2){ width:460px; height:460px; background:var(--chemistry); bottom:-180px; right:-100px; animation: drift2 32s ease-in-out infinite alternate; }
  .bg-aurora span:nth-child(3){ width:380px; height:380px; background:var(--maths); top:38%; left:58%; animation: drift3 22s ease-in-out infinite alternate; }
  @keyframes drift1{ from{ transform:translate(0,0) scale(1);} to{ transform:translate(60px,40px) scale(1.15);} }
  @keyframes drift2{ from{ transform:translate(0,0) scale(1);} to{ transform:translate(-50px,-30px) scale(1.1);} }
  @keyframes drift3{ from{ transform:translate(0,0) scale(1);} to{ transform:translate(-40px,50px) scale(0.9);} }

  .app{
    position:relative; z-index:1; max-width: 1180px; margin: 0 auto;
    opacity:0; transform: translateY(16px);
    animation: pageIn .6s var(--ease) .05s forwards;
  }
  @keyframes pageIn{ to{ opacity:1; transform:translateY(0); } }

  /* ---------- Header ---------- */
  .masthead{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap: 20px; flex-wrap: wrap; margin-bottom: 22px;
    border-bottom: 1px solid var(--border); padding-bottom: 18px;
  }
  .masthead-title{ display:flex; flex-direction:column; gap:4px; }
  .eyebrow{
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-faint);
  }
  h1{ font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  h1 span{
    background: linear-gradient(100deg, var(--physics), var(--chemistry), var(--physics));
    background-size: 220% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 6s linear infinite;
  }
  @keyframes shimmer{ to{ background-position: -220% center; } }

  .week-nav{ display:flex; align-items:center; gap: 10px; }
  .week-range{ font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-dim); min-width: 168px; text-align:center; }
  .nav-btn{
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    width: 34px; height: 34px; border-radius: 8px; cursor: pointer;
    display:flex; align-items:center; justify-content:center; font-size: 15px;
    transition: background .15s, border-color .15s, transform .12s;
  }
  .nav-btn:hover{ background: var(--surface-3); border-color: #c3ccd6; }
  .nav-btn:active{ transform: scale(.92); }
  .nav-btn:focus-visible, .today-btn:focus-visible, .cell:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline: 2px solid var(--physics); outline-offset: 2px;
  }
  .today-btn{
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 8px 12px;
    border-radius: 8px; cursor: pointer; transition: all .15s;
  }
  .today-btn:hover{ color: var(--text); border-color: var(--physics); }

  /* ---------- Legend + Stats ---------- */
  .info-row{ display:flex; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; align-items: stretch; }
  .legend{
    display:flex; gap: 16px; flex-wrap: wrap; align-items:center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 18px; flex: 1; min-width: 260px;
  }
  .legend-group{ display:flex; gap:14px; flex-wrap:wrap; }
  .legend-item{ display:flex; align-items:center; gap: 7px; font-size: 12.5px; color: var(--text-dim); }
  .swatch{ width: 10px; height: 10px; border-radius: 3px; flex-shrink:0; }
  .legend-sep{ width:1px; align-self:stretch; background: var(--border); margin: 0 2px; }

  .stats{ display:flex; gap: 10px; }
  .stat-card{ background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 16px; min-width: 84px; text-align:center; }
  .stat-num{ font-family:'JetBrains Mono', monospace; font-size: 19px; font-weight: 600; line-height:1.1; }
  .stat-label{ font-size: 10.5px; color: var(--text-faint); text-transform:uppercase; letter-spacing:.06em; margin-top:3px; }
  .stat-card.missed .stat-num{ color: var(--danger); }
  .stat-card.done .stat-num{ color: var(--success); }

  /* ---------- Subject breakdown ---------- */
  .breakdown{ background: var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 18px; margin-bottom: 22px; }
  .breakdown-title{ font-family:'JetBrains Mono', monospace; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin-bottom:12px; }
  .breakdown-empty{ font-size:12.5px; color:var(--text-faint); }
  .breakdown-row{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .breakdown-row:last-child{ margin-bottom:0; }
  .breakdown-name{ width:100px; flex-shrink:0; font-size:12px; color:var(--text-dim); display:flex; align-items:center; gap:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .breakdown-name .swatch{ flex-shrink:0; }
  .breakdown-bar-track{ flex:1; height:8px; background: var(--surface-2); border-radius:5px; overflow:hidden; }
  .breakdown-bar-fill{ height:100%; border-radius:5px; width:0%; transition: width .8s var(--ease); }
  .breakdown-count{ width:54px; flex-shrink:0; text-align:right; font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--text-faint); }

  /* ---------- Grid ---------- */
  .grid-flip-stage{ perspective: 1400px; }
  .grid-scroll{
    overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; background: var(--surface);
    transform-style: preserve-3d; will-change: transform, opacity;
  }
  .grid-scroll.flip-exit-next{ animation: flipExitNext var(--flip-duration) var(--ease) forwards; }
  .grid-scroll.flip-exit-prev{ animation: flipExitPrev var(--flip-duration) var(--ease) forwards; }
  .grid-scroll.flip-enter-next{ animation: flipEnterNext var(--flip-duration) var(--ease) forwards; }
  .grid-scroll.flip-enter-prev{ animation: flipEnterPrev var(--flip-duration) var(--ease) forwards; }
  @keyframes flipExitNext{ to{ transform: rotateY(-16deg) translateX(-40px) translateZ(-120px); opacity:0; } }
  @keyframes flipExitPrev{ to{ transform: rotateY(16deg) translateX(40px) translateZ(-120px); opacity:0; } }
  @keyframes flipEnterNext{ from{ transform: rotateY(16deg) translateX(40px) translateZ(-120px); opacity:0; } to{ transform:none; opacity:1; } }
  @keyframes flipEnterPrev{ from{ transform: rotateY(-16deg) translateX(-40px) translateZ(-120px); opacity:0; } to{ transform:none; opacity:1; } }

  .grid{
    display: grid;
    grid-template-columns: 96px repeat(7, minmax(122px, 1fr));
    grid-auto-rows: 29px;
    min-width: 980px;
    position: relative;
  }
  .corner, .day-head{
    position: sticky; top:0; z-index: 5;
    background: var(--surface-2); border-bottom: 1px solid var(--border);
    padding: 12px 8px; text-align:center; grid-row: 1;
  }
  .corner{ left:0; z-index:6; border-right: 1px solid var(--border); }
  .day-head{ border-left: 1px solid var(--border-soft); }
  .day-head .dname{ font-family:'Space Grotesk', sans-serif; font-size: 13px; font-weight:600; letter-spacing:.03em; }
  .day-head .ddate{ font-family:'JetBrains Mono', monospace; font-size: 11px; color: var(--text-faint); margin-top:2px; }
  .day-head.is-today{ background: linear-gradient(180deg, rgba(47,126,216,0.12), var(--surface-2) 90%); }
  .day-head.is-today .dname{ color: var(--physics); }
  .day-head.is-today::after{ content:''; display:block; height:2px; background: var(--physics); margin-top:8px; border-radius:2px; }

  .time-cell{
    position: sticky; left: 0; z-index: 4;
    background: var(--surface-2); border-right: 1px solid var(--border);
    border-top: 1px solid var(--border-hour);
    font-family:'JetBrains Mono', monospace; font-size: 11px; color: var(--text-faint);
    display:flex; align-items:flex-start; justify-content:center; padding-top: 4px;
    text-align:center; line-height:1.3; grid-column: 1;
  }

  .cell{
    border-bottom: 1px solid var(--border-soft); border-left: 1px solid var(--border-soft);
    padding: 3px 6px; cursor: pointer; position: relative; overflow:hidden;
  }
  .cell.hour-start{ border-top: 1px solid var(--border-hour); }
  .cell.empty:hover{ background: var(--surface-2); }
  .cell.empty::before{
    content:'+'; color: var(--text-faint); font-size: 14px; opacity:0;
    position:absolute; top:50%; left:50%; transform: translate(-50%,-50%); transition: opacity .12s;
  }
  .cell.empty:hover::before{ opacity: 0.6; }

  .lec{
    height: 100%; width:100%; border-radius: 8px; padding: 6px 8px; font-size: 12px;
    border-left: 3px solid var(--subj-color, #9aa2ac); background: var(--subj-dim, rgba(20,30,45,0.035));
    position:relative; cursor:pointer;
    display:flex; flex-direction:column; overflow:hidden;
    transform-style: preserve-3d;
    transition: transform .18s var(--ease), box-shadow .18s var(--ease);
  }
  .lec::before{
    content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background: radial-gradient(120px circle at var(--mx,50%) var(--my,50%), rgba(15,23,42,0.07), transparent 60%);
    opacity:0; transition: opacity .2s;
  }
  .lec.tilt-hover::before{ opacity:1; }
  .lec.tilt-hover{ box-shadow: 0 12px 26px -8px rgba(30,41,59,0.22); z-index:3; }
  .lec.pressed{ transform: scale(1.045) translateZ(6px); box-shadow: 0 10px 24px -6px rgba(30,41,59,0.22); z-index:3; }
  .lec.card-in{ animation: cardIn .46s var(--ease) backwards; }
  @keyframes cardIn{ from{ opacity:0; transform: translateY(10px) rotateX(-10deg) scale(.94);} to{ opacity:1; transform:none;} }

  .lec-name{ font-weight:600; line-height:1.25; word-break: break-word; }
  .lec-time{ font-family:'JetBrains Mono', monospace; font-size: 9.5px; color: var(--text-faint); margin-top:auto; padding-top:3px; text-transform:uppercase; letter-spacing:.03em; }

  .lec.completed{ opacity: 0.5; }
  .lec.completed .lec-name{ text-decoration: line-through; text-decoration-color: var(--text-faint); }
  .lec.today-pending{ box-shadow: inset 0 0 0 1.5px var(--due); }

  .pulse-dot{
    width:7px; height:7px; border-radius:50%; background: var(--due);
    position:absolute; top:7px; right:7px; animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.4; transform:scale(1.3);} }

  .note-flag{ position:absolute; bottom:5px; left:6px; width:13px; height:13px; color: var(--text-faint); opacity:.85; }
  .note-flag svg{ width:100%; height:100%; display:block; }

  .now-line{ position:relative; height:2px; background: linear-gradient(90deg, var(--due), transparent 85%); border-radius:2px; pointer-events:none; z-index:3; }
  .now-line::before{
    content:''; position:absolute; left:-3px; top:-3px; width:8px; height:8px; border-radius:50%;
    background:var(--due); box-shadow:0 0 8px 2px rgba(217,119,6,.55); animation: pulse 1.8s ease-in-out infinite;
  }

  .check-btn{
    position:absolute; top:5px; right:5px; width:19px; height:19px; border-radius:6px;
    border: 1.5px solid var(--text-faint); background: var(--surface); cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0; color: transparent; font-size: 12px; line-height:1;
    transition: transform .15s var(--ease-pop);
  }
  .lec.completed .check-btn{ border-color: var(--success); background: var(--success-dim); color: var(--success); }
  .check-btn:hover{ border-color: var(--success); }
  .check-btn:active{ transform: scale(.85); }
  .check-btn.burst::after{
    content:''; position:absolute; inset:-6px; border-radius:50%; border:2px solid var(--success);
    animation: burstRing .5s ease-out forwards;
  }
  @keyframes burstRing{ from{ opacity:1; transform:scale(.4);} to{ opacity:0; transform:scale(2.1);} }

  .lec.missed{ border-left-color: var(--danger); box-shadow: inset 0 0 0 1px rgba(220,47,53,0.28); }

  .lec.live-now{ animation: liveGlow 2.2s ease-in-out infinite; }
  @keyframes liveGlow{
    0%,100%{ box-shadow: 0 0 0 1.5px var(--due), 0 0 10px 1px rgba(217,119,6,.28); }
    50%{ box-shadow: 0 0 0 1.5px var(--due), 0 0 20px 4px rgba(217,119,6,.50); }
  }
  .lec.pop-alert{ animation: popAlert 1.6s var(--ease-pop); z-index:4; }
  @keyframes popAlert{
    0%{ transform: scale(1) rotateY(0deg); }
    15%{ transform: scale(1.12) rotateY(-6deg) translateZ(20px); box-shadow: 0 18px 40px -8px rgba(217,119,6,.40); }
    30%{ transform: scale(1.04) rotateY(4deg) translateZ(10px); }
    45%{ transform: scale(1.1) rotateY(-3deg) translateZ(16px); }
    60%{ transform: scale(1.02) rotateY(2deg); }
    100%{ transform: scale(1) rotateY(0deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .lec.live-now{ animation:none; box-shadow: 0 0 0 2px var(--due); }
    .lec.pop-alert{ animation:none; }
  }
  .stamp{
    position:absolute; bottom:5px; right:5px; border:1.5px solid var(--danger); color: var(--danger);
    font-family:'JetBrains Mono', monospace; font-size: 8.5px; font-weight:700; letter-spacing:.05em;
    padding: 1px 5px; border-radius: 3px; transform: rotate(-6deg); opacity:0.9; background: rgba(220,47,53,0.08);
  }

  .ripple{ position:absolute; border-radius:50%; background: rgba(30,41,59,0.14); transform:scale(0); animation: rippleAnim .5s ease-out forwards; pointer-events:none; }
  @keyframes rippleAnim{ to{ transform:scale(2.6); opacity:0; } }

  /* ---------- Modal ---------- */
  .overlay{
    position: fixed; inset:0; background: rgba(20,28,40,0.45); backdrop-filter: blur(2px);
    display:flex; align-items:center; justify-content:center; z-index: 50; padding: 20px;
    perspective: 1000px; opacity:0; visibility:hidden;
    transition: opacity .25s ease, visibility 0s linear .25s;
  }
  .overlay.open{ opacity:1; visibility:visible; transition: opacity .25s ease; }
  .modal{
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 380px; padding: 22px;
    box-shadow: 0 20px 60px rgba(30,41,59,0.20); transform-origin: center bottom;
    transform: scale(.86) rotateX(10deg) translateY(14px); opacity:0;
    transition: transform .34s var(--ease-pop), opacity .28s ease;
  }
  .overlay.open .modal{ transform:none; opacity:1; }
  .modal-when{ font-family:'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-faint); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .05em; }
  .modal h2{ font-family:'Space Grotesk', sans-serif; font-size: 17px; margin: 0 0 18px; }
  .field-label{ font-size: 11.5px; color: var(--text-dim); margin-bottom: 7px; display:block; font-weight:500; }
  .subj-row{ display:flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .subj-btn{
    flex: 1 1 28%; min-width: 76px; border-radius: 9px; padding: 9px 4px; cursor:pointer; font-size: 12.5px; font-weight:600;
    background: var(--surface-2); border: 1.5px solid var(--border); color: var(--text-dim);
    transition: all .12s; display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  .subj-btn .dot{ width:9px; height:9px; border-radius:50%; background: var(--subj-color); }
  .subj-btn.active{ border-color: var(--subj-color); color: var(--subj-color); background: var(--subj-dim); }
  .subj-add-btn{
    flex: 1 1 28%; min-width: 76px; border-radius: 9px; padding: 9px 4px; cursor:pointer; font-size: 12.5px; font-weight:600;
    background: transparent; border: 1.5px dashed var(--border-hour); color: var(--text-faint);
    display:flex; align-items:center; justify-content:center; gap:4px; transition: all .15s;
  }
  .subj-add-btn:hover{ color: var(--text-dim); border-color: var(--text-dim); background: var(--surface-2); }

  .text-input{
    width:100%; background: var(--surface-2); border: 1.5px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 10px 12px; font-size: 13.5px; font-family:'Inter',sans-serif; margin-bottom: 16px;
  }
  .text-input:focus{ border-color: var(--physics); outline:none; }
  textarea.text-input{ resize: vertical; min-height: 52px; line-height:1.4; }

  .dur-chips{ display:flex; gap:8px; margin-bottom: 12px; }
  .dur-chip{ flex:1; border-radius:9px; padding: 8px 4px; cursor:pointer; font-size:12.5px; font-weight:600; background: var(--surface-2); border: 1.5px solid var(--border); color: var(--text-dim); }
  .dur-chip.active{ border-color: var(--physics); color: var(--physics); background: var(--physics-dim); }
  .dur-slider-wrap{ margin-bottom: 6px; }
  .dur-label{ font-family:'JetBrains Mono', monospace; font-size: 13px; font-weight:600; color: var(--text); text-align:center; margin-bottom: 10px; }
  .dur-slider-track{
    position:relative; height: 6px; border-radius: 4px; background: var(--surface-2);
    margin: 0 11px 4px; cursor:pointer; touch-action: none;
  }
  .dur-slider-fill{ position:absolute; left:0; top:0; height:100%; border-radius:4px; background: linear-gradient(90deg, var(--physics), var(--maths)); width:20%; transition: width .05s linear; }
  .dur-slider-thumb{
    position:absolute; top:50%; left:20%; width:22px; height:22px; border-radius:50%;
    background: var(--text); border: 3px solid var(--bg); box-shadow: 0 0 0 2px var(--physics), 0 2px 8px rgba(30,41,59,.35);
    transform: translate(-50%,-50%); cursor:grab; transition: left .05s linear, transform .12s var(--ease-pop);
  }
  .dur-slider-thumb:active{ cursor:grabbing; transform: translate(-50%,-50%) scale(1.18); }
  .dur-ticks{ display:flex; justify-content:space-between; padding: 0 2px; margin-bottom: 14px; }
  .dur-ticks span{ font-family:'JetBrains Mono', monospace; font-size: 9.5px; color: var(--text-faint); }

  .type-row{ display:flex; gap:8px; margin: 16px 0 20px; }
  .type-btn{ flex:1; border-radius:9px; padding: 8px; cursor:pointer; font-size:12px; background: var(--surface-2); border: 1.5px solid var(--border); color: var(--text-dim); }
  .type-btn.active{ border-color: var(--text-dim); color: var(--text); background: var(--surface-3); }

  .err-msg{ font-size: 11.5px; color: var(--danger); margin: -10px 0 14px; min-height: 14px; }

  .modal-actions{ display:flex; gap: 8px; }
  .btn{ flex:1; border-radius: 9px; padding: 10px; font-size: 13px; font-weight:600; cursor:pointer; border:none; }
  .btn-save{ background: var(--physics); color: #ffffff; }
  .btn-cancel{ background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); }
  .btn-delete{ background: transparent; color: var(--danger); border: 1px solid rgba(220,47,53,0.30); }
  .hidden{ display:none !important; }

  /* ---------- Subjects modal ---------- */
  .subj-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; max-height:190px; overflow-y:auto; }
  .subj-list-row{ display:flex; align-items:center; gap:10px; padding:7px 9px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border); }
  .subj-list-row .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .subj-list-row .nm{ flex:1; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .subj-list-row .tag{ font-size:9.5px; color:var(--text-faint); font-family:'JetBrains Mono', monospace; text-transform:uppercase; }
  .subj-list-row .rm{ background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:16px; line-height:1; padding:2px 5px; }
  .subj-list-row .rm:hover{ color:var(--danger); }
  .color-picker{ display:flex; gap:9px; flex-wrap:wrap; margin-bottom:16px; }
  .color-swatch{ width:24px; height:24px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition: transform .12s; }
  .color-swatch:hover{ transform: scale(1.15); }
  .color-swatch.picked{ box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px currentColor; }

  footer{ text-align:center; margin-top: 26px; font-size: 11.5px; color: var(--text-faint); font-family:'JetBrains Mono', monospace; }
  .foot-actions{ display:flex; gap:14px; justify-content:center; margin-top:8px; flex-wrap:wrap; }
  .foot-actions button{ background:none; border:none; color: var(--text-faint); text-decoration: underline; cursor:pointer; font-family: inherit; font-size: 11.5px; }
  .foot-actions button:hover{ color: var(--text-dim); }

  @media (max-width: 640px){
    body{ padding: 18px 12px 40px; }
    .masthead{ flex-direction:column; align-items:flex-start; }
    h1{ font-size: 21px; }
  }

  @media (prefers-reduced-motion: reduce){
    .app{ animation:none; opacity:1; transform:none; }
    h1 span{ animation:none; -webkit-text-fill-color: var(--physics); background:none; }
    .bg-aurora span{ animation:none; }
    .grid-scroll{ animation:none !important; transform:none !important; }
    .lec.card-in{ animation:none; }
    .lec{ transition:none; }
    .pulse-dot, .now-line::before{ animation:none; }
    .ripple{ display:none; }
  }
</style>
</head>
<body>

<div class="app">

  <div class="masthead">
    <div class="masthead-title">
      <div class="eyebrow">Self-Study · Lecture Register</div>
      <h1>Weekly <span>Watch</span> Tracker</h1>
    </div>
    <div class="week-nav">
      <button class="nav-btn" id="prevWeek" aria-label="Previous week">←</button>

  <div class="info-row">

      <div class="legend-group" id="legendSubjects"><!-- built by JS --></div>
      <div class="legend-sep"></div>
      <div class="legend-group">
        <div class="legend-item"><span class="swatch" style="background:var(--due)"></span>Due today</div>
        <div class="legend-item"><span class="swatch" style="background:var(--danger)"></span>Missed</div>

  <div class="modal">

    <span class="field-label">Notes (optional)</span>

<input type="file" id="fileInput" accept="application/json" style="display:none">

<script>
(function(){
  const START_HOUR = 6;      // 6 AM
  const END_HOUR = 22;       // 10 PM (exclusive end of grid)
  const SLOT_COUNT = (END_HOUR - START_HOUR) * 2; // 30-min slots
  const DAY_NAMES = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
  const STORE_KEY = 'lectureRegisterData_v2';
  const SUBJ_KEY = 'lectureRegisterSubjects_v1';

  const BUILTIN_SUBJECTS = [
    { id:'physics',   name:'Physics',   color:'#2f7ed8' },
    { id:'chemistry', name:'Chemistry', color:'#7c5cf0' },
    { id:'maths',     name:'Maths',     color:'#0aa39a' }
  ];
  const SUBJECT_PALETTE = ['#0ea5e9','#14b8a6','#6366f1','#8b5cf6','#0891b2','#38bdf8','#64748b','#2dd4bf'];

  const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FINE_POINTER = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function isoDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function getMonday(d){
    const date = new Date(d); const day = date.getDay();
    const diff = day===0 ? -6 : 1-day;
    date.setDate(date.getDate()+diff); date.setHours(0,0,0,0);
    return date;
  }
  function addDays(d,n){ const nd = new Date(d); nd.setDate(nd.getDate()+n); return nd; }
  function hourLabel(h){
    const period = h>=12 ? 'PM' : 'AM';
    let hr = h%12; if(hr===0) hr=12;
    return hr+' '+period;
  }
  function timeLabel(h,m){
    const period = h>=12 ? 'PM' : 'AM';
    let hr = h%12; if(hr===0) hr=12;
    return hr+(m===30 ? ':30' : ':00')+' '+period;
  }
  function fmtDateShort(d){ return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}); }
  function fmtRange(monday){
    const sunday = addDays(monday,6);
    const sameMonth = monday.getMonth()===sunday.getMonth();
    const left = monday.toLocaleDateString('en-IN',{day:'numeric', month: sameMonth?undefined:'short'});
    const right = sunday.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
    return left+' – '+right+', '+sunday.getFullYear();
  }
  function slotToHM(slot){ return { h: START_HOUR + Math.floor(slot/2), m: (slot%2)*30 }; }
  function hmToSlot(h,m){ return (h-START_HOUR)*2 + (m>=30?1:0); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function hexToRgba(hex, a){
    let h = (hex || '#7c8398').replace('#','');
    if(h.length===3) h = h.split('').map(function(c){ return c+c; }).join('');
    const n = parseInt(h,16);
    const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    return 'rgba('+r+','+g+','+b+','+a+')';
  }

  /* ---------- Subjects (built-in + custom) ---------- */
  let customSubjects = [];
  try{ customSubjects = JSON.parse(localStorage.getItem(SUBJ_KEY) || '[]'); }catch(e){ customSubjects = []; }
  if(!Array.isArray(customSubjects)) customSubjects = [];

  function saveSubjects(){ try{ localStorage.setItem(SUBJ_KEY, JSON.stringify(customSubjects)); }catch(e){} }
  function allSubjects(){ return BUILTIN_SUBJECTS.concat(customSubjects); }
  function getSubject(id){
    return allSubjects().find(function(s){ return s.id===id; }) || { id: id||'unknown', name:'Other', color:'#7c8398' };
  }
  function nextPaletteColor(){
    const used = allSubjects().map(function(s){ return s.color.toLowerCase(); });
    const free = SUBJECT_PALETTE.find(function(c){ return used.indexOf(c.toLowerCase())===-1; });
    return free || SUBJECT_PALETTE[customSubjects.length % SUBJECT_PALETTE.length];
  }
  function addSubject(name, color){
    const id = 'c_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    customSubjects.push({ id: id, name: name.slice(0,24), color: color });
    saveSubjects();
    return id;
  }
  function removeSubject(id){
    customSubjects = customSubjects.filter(function(s){ return s.id!==id; });
    saveSubjects();
  }

  let data = {};
  try{ data = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); }catch(e){ data = {}; }

  // migrate from v1 (hour-only keys, implicit 60min) if present
  (function migrateV1(){
    try{
      const old = JSON.parse(localStorage.getItem('lectureRegisterData_v1') || 'null');
      if(old && Object.keys(data).length===0){
        Object.keys(old).forEach(function(k){
          const m = k.match(/^(\d{4}-\d{2}-\d{2})_(\d{1,2})$/);
          if(m){
            const newKey = m[1]+'_'+pad(parseInt(m[2],10))+':00';
            data[newKey] = Object.assign({durationMin:60}, old[k]);
          }
        });
        persist();
      }
    }catch(e){}
  })();

  function persist(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){} }

  let weekStart = getMonday(new Date());
  let modalCtx = null;
  let activeSubj = null;
  let activeType = 'live';
  let activeDur = 60;
  let pickedColor = null;

  const grid = document.getElementById('grid');
  const gridScroll = document.getElementById('gridScroll');
  const weekRangeEl = document.getElementById('weekRange');
  const overlay = document.getElementById('overlay');
  const modalWhen = document.getElementById('modalWhen');
  const modalTitle = document.getElementById('modalTitle');
  const lecInput = document.getElementById('lecInput');
  const notesInput = document.getElementById('notesInput');
  const subjRow = document.getElementById('subjRow');
  const typeRow = document.getElementById('typeRow');
  const durChips = document.getElementById('durChips');
  const durTrack = document.getElementById('durTrack');
  const durFill = document.getElementById('durFill');
  const durThumb = document.getElementById('durThumb');
  const durLabel = document.getElementById('durLabel');
  const DUR_MIN = 15, DUR_MAX = 240, DUR_STEP = 5;
  const deleteBtn = document.getElementById('deleteBtn');
  const errMsg = document.getElementById('errMsg');
  const subjOverlay = document.getElementById('subjOverlay');

  function entryKey(dateISO, h, m){ return dateISO+'_'+pad(h)+':'+pad(m); }

  function computeStatus(entry, dateObj, endH, endM){
    if(entry.watched) return 'completed';
    const now = new Date();
    const end = new Date(dateObj); end.setHours(endH, endM, 0, 0);
    if(now > end) return 'missed';
    if(isoDate(dateObj)===isoDate(now)) return 'today-pending';
    return 'scheduled';
  }

  // build a per-day occupancy map for the visible week: occ[dayIdx][slot] = {type:'start'|'cover', key}
  function buildOccupancy(dayDates){
    const occ = dayDates.map(function(){ return new Array(SLOT_COUNT).fill(null); });
    Object.keys(data).forEach(function(key){
      const m = key.match(/^(\d{4}-\d{2}-\d{2})_(\d{2}):(\d{2})$/);
      if(!m) return;
      const dISO = m[1];
      const dayIdx = dayDates.findIndex(function(d){ return isoDate(d)===dISO; });
      if(dayIdx===-1) return;
      const h = parseInt(m[2],10), mi = parseInt(m[3],10);
      const startSlot = hmToSlot(h,mi);
      const entry = data[key];
      const span = Math.ceil((entry.durationMin||60)/30);
      for(let s=startSlot; s<startSlot+span && s<SLOT_COUNT; s++){
        occ[dayIdx][s] = (s===startSlot) ? {type:'start', key:key} : {type:'cover', key:key};
      }
    });
    return occ;
  }

  function computeBreakdown(dayDates){
    const startISO = isoDate(dayDates[0]), endISO = isoDate(dayDates[6]);
    const map = {};
    Object.keys(data).forEach(function(key){
      const m = key.match(/^(\d{4}-\d{2}-\d{2})_(\d{2}):(\d{2})$/);
      if(!m) return;
      const dISO = m[1];
      if(dISO < startISO || dISO > endISO) return;
      const dayIdx = dayDates.findIndex(function(d){ return isoDate(d)===dISO; });
      if(dayIdx===-1) return;
      const dateObj = dayDates[dayIdx];
      const entry = data[key];
      const h = parseInt(m[2],10), mi = parseInt(m[3],10);
      const endTotal = h*60+mi+(entry.durationMin||60);
      const endH = Math.floor(endTotal/60), endM = endTotal%60;
      const status = computeStatus(entry, dateObj, endH, endM);
      const sid = entry.subject;
      if(!map[sid]) map[sid] = {total:0, watched:0, missed:0};
      map[sid].total++;
      if(status==='completed') map[sid].watched++;
      if(status==='missed') map[sid].missed++;
    });
    return map;
  }

  function renderLegend(){
    const el = document.getElementById('legendSubjects');
    el.innerHTML = allSubjects().map(function(s){
      return '<div class="legend-item"><span class="swatch" style="background:'+s.color+'"></span>'+escapeHtml(s.name)+'</div>';
    }).join('');
  }

  function renderBreakdown(map){
    const el = document.getElementById('breakdown');
    const ids = Object.keys(map).filter(function(id){ return map[id].total>0; });
    if(ids.length===0){
      el.innerHTML = '<div class="breakdown-title">Subject breakdown</div><div class="breakdown-empty">No lectures logged this week yet.</div>';
      return;
    }
    ids.sort(function(a,b){
      const ai = BUILTIN_SUBJECTS.findIndex(function(s){ return s.id===a; });
      const bi = BUILTIN_SUBJECTS.findIndex(function(s){ return s.id===b; });
      if(ai!==-1 && bi!==-1) return ai-bi;
      if(ai!==-1) return -1;
      if(bi!==-1) return 1;
      return map[b].total - map[a].total;
    });
    let html = '<div class="breakdown-title">Subject breakdown</div>';
    ids.forEach(function(id){
      const subj = getSubject(id);
      const c = map[id];
      const pct = c.total ? Math.round((c.watched/c.total)*100) : 0;
      html += '<div class="breakdown-row">'
        + '<div class="breakdown-name"><span class="swatch" style="background:'+subj.color+'"></span>'+escapeHtml(subj.name)+'</div>'
        + '<div class="breakdown-bar-track"><div class="breakdown-bar-fill" data-pct="'+pct+'" style="background:'+subj.color+'"></div></div>'
        + '<div class="breakdown-count">'+c.watched+'/'+c.total+'</div>'
        + '</div>';
    });
    el.innerHTML = html;
    requestAnimationFrame(function(){
      el.querySelectorAll('.breakdown-bar-fill').forEach(function(fill){
        fill.style.width = fill.dataset.pct + '%';
      });
    });
  }

  function animateCount(el, to){
    if(REDUCED_MOTION){ el.textContent = to; return; }
    const from = parseInt(el.textContent,10) || 0;
    if(from===to){ el.textContent = to; return; }
    const dur = 420; const start = performance.now();
    function step(now){
      const p = Math.min(1, (now-start)/dur);
      const eased = 1 - Math.pow(1-p, 3);
      const val = Math.round(from + (to-from)*eased);
      el.textContent = val;
      if(p<1) requestAnimationFrame(step);
      else el.textContent = to;
    }
    requestAnimationFrame(step);
  }

  function handleTilt(ev){
    const lec = ev.currentTarget;
    const rect = lec.getBoundingClientRect();
    const px = (ev.clientX-rect.left)/rect.width, py = (ev.clientY-rect.top)/rect.height;
    const rx = (0.5-py)*12, ry = (px-0.5)*12;
    lec.style.transform = 'perspective(600px) rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg) translateZ(4px)';
    lec.style.setProperty('--mx', (px*100)+'%');
    lec.style.setProperty('--my', (py*100)+'%');
    lec.classList.add('tilt-hover');
  }
  function clearTilt(ev){
    const lec = ev.currentTarget;
    lec.style.transform = '';
    lec.classList.remove('tilt-hover');
  }

  function spawnRipple(el, clientX, clientY){
    if(REDUCED_MOTION) return;
    const rect = el.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.4;
    const span = document.createElement('span');
    span.className = 'ripple';
    span.style.width = span.style.height = size+'px';
    span.style.left = (clientX - rect.left - size/2)+'px';
    span.style.top = (clientY - rect.top - size/2)+'px';
    el.appendChild(span);
    span.addEventListener('animationend', function(){ span.remove(); });
  }
  document.addEventListener('pointerdown', function(ev){
    const el = ev.target.closest('button, .cell, .lec');
    if(!el) return;
    spawnRipple(el, ev.clientX, ev.clientY);
  });

  function renderNowLine(dayDates, todayISO){
    const idx = dayDates.findIndex(function(d){ return isoDate(d)===todayISO; });
    if(idx===-1) return;
    const now = new Date();
    const h = now.getHours(), mi = now.getMinutes();
    if(h < START_HOUR || h >= END_HOUR) return;
    const slot = hmToSlot(h, mi - (mi%30));
    const rowStart = 2 + slot;
    const fraction = (mi%30)/30;
    const line = document.createElement('div');
    line.className = 'now-line';
    line.style.gridColumn = String(idx+2);
    line.style.gridRow = String(rowStart);
    line.style.transform = 'translateY('+(fraction*29)+'px)';
    grid.appendChild(line);
  }

  function render(animateCards){
    renderLegend();
    weekRangeEl.textContent = fmtRange(weekStart);
    grid.innerHTML = '';
    grid.style.gridTemplateRows = 'auto repeat(' + SLOT_COUNT + ', 29px)';

    const corner = document.createElement('div');
    corner.className = 'corner';
    grid.appendChild(corner);

    const todayISO = isoDate(new Date());
    const dayDates = [];
    for(let i=0;i<7;i++){
      const d = addDays(weekStart, i);
      dayDates.push(d);
      const head = document.createElement('div');
      head.className = 'day-head' + (isoDate(d)===todayISO ? ' is-today' : '');
      head.style.gridColumn = String(i+2);
      head.innerHTML = '<div class="dname">'+DAY_NAMES[i]+'</div><div class="ddate">'+fmtDateShort(d)+'</div>';
      grid.appendChild(head);
    }

    // hour labels (span 2 rows each)
    for(let h=START_HOUR; h<END_HOUR; h++){
      const rowStart = 2 + (h-START_HOUR)*2;
      const tc = document.createElement('div');
      tc.className = 'time-cell';
      tc.textContent = hourLabel(h);
      tc.style.gridRow = rowStart + ' / span 2';
      grid.appendChild(tc);
    }

    const occ = buildOccupancy(dayDates);
    let total=0, done=0, missed=0, cardIdx=0;

    dayDates.forEach(function(d, dayIdx){
      const dISO = isoDate(d);
      for(let slot=0; slot<SLOT_COUNT; slot++){
        const rowStart = 2 + slot;
        const cellOcc = occ[dayIdx][slot];

        if(!cellOcc){
          const hm = slotToHM(slot);
          const h = hm.h, m = hm.m;
          const cell = document.createElement('div');
          cell.className = 'cell empty' + (slot%2===0 ? ' hour-start' : '');
          cell.style.gridColumn = String(dayIdx+2);
          cell.style.gridRow = String(rowStart);
          cell.tabIndex = 0;
          cell.addEventListener('click', function(){ openModal(dISO, h, m, d); });
          cell.addEventListener('keydown', function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); openModal(dISO,h,m,d); } });
          grid.appendChild(cell);
        } else if(cellOcc.type==='start'){
          const key = cellOcc.key;
          const entry = data[key];
          const m = key.match(/^(\d{4}-\d{2}-\d{2})_(\d{2}):(\d{2})$/);
          const h = parseInt(m[2],10), mi = parseInt(m[3],10);
          const durationMin = entry.durationMin||60;
          const span = Math.ceil(durationMin/30);
          const endTotal = h*60+mi+durationMin;
          const endH = Math.floor(endTotal/60), endM = endTotal%60;

          total++;
          const status = computeStatus(entry, d, endH, endM);
          if(status==='completed') done++;
          if(status==='missed') missed++;

          const nowDt = new Date();
          const startDt = new Date(d); startDt.setHours(h, mi, 0, 0);
          const endDt = new Date(d); endDt.setHours(endH, endM, 0, 0);
          const isLiveNow = !entry.watched && isoDate(d)===isoDate(nowDt) && nowDt>=startDt && nowDt<endDt;

          const subj = getSubject(entry.subject);
          const lec = document.createElement('div');
          lec.className = 'lec' + (status==='completed' ? ' completed' : '') + (status==='missed' ? ' missed' : '') + (status==='today-pending' ? ' today-pending' : '') + (isLiveNow ? ' live-now' : '');
          lec.dataset.key = key;
          lec.style.setProperty('--subj-color', subj.color);
          lec.style.setProperty('--subj-dim', hexToRgba(subj.color, 0.14));
          lec.style.gridColumn = String(dayIdx+2);
          lec.style.gridRow = rowStart + ' / span ' + span;
          lec.style.alignSelf = 'start';
          lec.style.height = ((durationMin/30)*29) + 'px';
          if(animateCards && !REDUCED_MOTION){
            lec.classList.add('card-in');
            lec.style.animationDelay = (cardIdx*26)+'ms';
            cardIdx++;
          }

          const name = document.createElement('div');
          name.className = 'lec-name';
          name.textContent = entry.lecture;
          lec.appendChild(name);

          const timeTag = document.createElement('div');
          timeTag.className = 'lec-time';
          timeTag.textContent = timeLabel(h,mi) + '–' + timeLabel(endH,endM) + ' · ' + (entry.type==='recorded'?'Recorded':'Live');
          lec.appendChild(timeTag);

          const check = document.createElement('button');
          check.className = 'check-btn';
          check.setAttribute('aria-label','Mark watched');
          check.textContent = '✓';
          check.addEventListener('click', function(ev){
            ev.stopPropagation();
            const willWatch = !entry.watched;
            entry.watched = willWatch;
            persist();
            if(willWatch && !REDUCED_MOTION){
              check.classList.add('burst');
              setTimeout(function(){ render(false); }, 260);
            } else {
              render(false);
            }
          });
          lec.appendChild(check);

          if(entry.notes){
            const flag = document.createElement('div');
            flag.className = 'note-flag';
            flag.title = entry.notes;
            flag.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H9l-5 4V4z"/></svg>';
            lec.appendChild(flag);
          }

          if(status==='today-pending'){
            const dot = document.createElement('div');
            dot.className = 'pulse-dot';
            lec.appendChild(dot);
          }
          if(status==='missed'){
            const stamp = document.createElement('div');
            stamp.className = 'stamp';
            stamp.textContent = 'MISSED';
            lec.appendChild(stamp);
          }

          if(FINE_POINTER && !REDUCED_MOTION){
            lec.addEventListener('pointermove', handleTilt);
            lec.addEventListener('pointerleave', clearTilt);
          } else {
            lec.addEventListener('touchstart', function(){ lec.classList.add('pressed'); }, {passive:true});
            lec.addEventListener('touchend', function(){ lec.classList.remove('pressed'); });
            lec.addEventListener('touchcancel', function(){ lec.classList.remove('pressed'); });
          }

          lec.addEventListener('click', function(){ openModal(dISO, h, mi, d, key); });
          grid.appendChild(lec);
        }
        // 'cover' slots render nothing — the spanning .lec above already fills that grid area
      }
    });

    renderNowLine(dayDates, todayISO);

    animateCount(document.getElementById('statTotal'), total);
    animateCount(document.getElementById('statDone'), done);
    animateCount(document.getElementById('statMissed'), missed);

    renderBreakdown(computeBreakdown(dayDates));
  }

  function findLiveNowUnwatched(){
    const now = new Date();
    const todayISO = isoDate(now);
    const results = [];
    Object.keys(data).forEach(function(key){
      const m = key.match(/^(\d{4}-\d{2}-\d{2})_(\d{2}):(\d{2})$/);
      if(!m || m[1]!==todayISO) return;
      const entry = data[key];
      if(entry.watched) return;
      const h = parseInt(m[2],10), mi = parseInt(m[3],10);
      const start = new Date(now); start.setHours(h, mi, 0, 0);
      const endTotal = h*60+mi+(entry.durationMin||60);
      const end = new Date(now); end.setHours(Math.floor(endTotal/60), endTotal%60, 0, 0);
      if(now>=start && now<end) results.push(key);
    });
    return results;
  }

  let lastAlertCheck = 0;
  function checkLiveNowAlert(){
    const now = Date.now();
    if(now - lastAlertCheck < 30000) return;
    lastAlertCheck = now;

    const todayISO = isoDate(new Date());
    const weekISOs = [];
    for(let i=0;i<7;i++) weekISOs.push(isoDate(addDays(weekStart,i)));
    if(weekISOs.indexOf(todayISO)===-1){
      weekStart = getMonday(new Date());
      render(true);
    }

    const keys = findLiveNowUnwatched();
    if(keys.length===0) return;

    setTimeout(function(){
      const firstEl = grid.querySelector('.lec[data-key="'+CSS.escape(keys[0])+'"]');
      if(firstEl) firstEl.scrollIntoView({ behavior: REDUCED_MOTION ? 'auto' : 'smooth', block:'center' });
      keys.forEach(function(key){
        const el = grid.querySelector('.lec[data-key="'+CSS.escape(key)+'"]');
        if(!el) return;
        el.classList.add('pop-alert');
        el.addEventListener('animationend', function handler(){
          el.classList.remove('pop-alert');
          el.removeEventListener('animationend', handler);
        });
      });
    }, 250);
  }

  function flipWeek(direction){
    if(REDUCED_MOTION){
      weekStart = addDays(weekStart, direction*7);
      render(true);
      return;
    }
    const exitClass = direction===1 ? 'flip-exit-next' : 'flip-exit-prev';
    const enterClass = direction===1 ? 'flip-enter-next' : 'flip-enter-prev';
    gridScroll.classList.add(exitClass);
    gridScroll.addEventListener('animationend', function onExit(){
      gridScroll.removeEventListener('animationend', onExit);
      gridScroll.classList.remove(exitClass);
      weekStart = addDays(weekStart, direction*7);
      render(true);
      gridScroll.classList.add(enterClass);
      gridScroll.addEventListener('animationend', function onEnter(){
        gridScroll.removeEventListener('animationend', onEnter);
        gridScroll.classList.remove(enterClass);
      }, {once:true});
    }, {once:true});
  }

  function fmtDuration(mins){
    const h = Math.floor(mins/60), m = mins%60;
    return h>0 ? (h+'h '+pad(m)+'m') : (m+'m');
  }
  function setDuration(mins){
    activeDur = Math.min(DUR_MAX, Math.max(DUR_MIN, Math.round(mins/DUR_STEP)*DUR_STEP));
    const pct = ((activeDur-DUR_MIN)/(DUR_MAX-DUR_MIN))*100;
    durFill.style.width = pct+'%';
    durThumb.style.left = pct+'%';
    durTrack.setAttribute('aria-valuenow', activeDur);
    durLabel.textContent = fmtDuration(activeDur);
    [...durChips.children].forEach(function(b){ b.classList.toggle('active', parseInt(b.dataset.d,10)===activeDur); });
    updateWhenText();
  }
  function durFromClientX(clientX){
    const rect = durTrack.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (clientX-rect.left)/rect.width));
    return DUR_MIN + pct*(DUR_MAX-DUR_MIN);
  }
  let draggingDur = false;
  durTrack.addEventListener('pointerdown', function(ev){
    draggingDur = true;
    durTrack.setPointerCapture(ev.pointerId);
    setDuration(durFromClientX(ev.clientX));
  });
  durTrack.addEventListener('pointermove', function(ev){
    if(!draggingDur) return;
    setDuration(durFromClientX(ev.clientX));
  });
  durTrack.addEventListener('pointerup', function(ev){ draggingDur = false; durTrack.releasePointerCapture(ev.pointerId); });
  durTrack.addEventListener('pointercancel', function(){ draggingDur = false; });
  durTrack.addEventListener('keydown', function(ev){
    if(ev.key==='ArrowRight' || ev.key==='ArrowUp'){ ev.preventDefault(); setDuration(activeDur+DUR_STEP); }
    else if(ev.key==='ArrowLeft' || ev.key==='ArrowDown'){ ev.preventDefault(); setDuration(activeDur-DUR_STEP); }
    else if(ev.key==='Home'){ ev.preventDefault(); setDuration(DUR_MIN); }
    else if(ev.key==='End'){ ev.preventDefault(); setDuration(DUR_MAX); }
  });

  function updateWhenText(){
    if(!modalCtx) return;
    const endTotal = modalCtx.hour*60+modalCtx.minute+activeDur;
    const endH = Math.floor(endTotal/60), endM = endTotal%60;
    modalWhen.textContent = modalCtx.dayName+' · '+fmtDateShort(modalCtx.dateObj)+' · '+timeLabel(modalCtx.hour, modalCtx.minute)+' – '+timeLabel(endH, endM);
  }

  function renderSubjRow(){
    subjRow.innerHTML = allSubjects().map(function(s){
      return '<button type="button" class="subj-btn" data-s="'+s.id+'" style="--subj-color:'+s.color+'; --subj-dim:'+hexToRgba(s.color,0.14)+';"><span class="dot"></span>'+escapeHtml(s.name)+'</button>';
    }).join('') + '<button type="button" class="subj-add-btn" id="subjAddInline">+ Add</button>';
    if(activeSubj){
      const btn = subjRow.querySelector('[data-s="'+CSS.escape(activeSubj)+'"]');
      if(btn) btn.classList.add('active');
    }
  }

  function openModal(dateISO, h, m, dateObj, existingKey){
    const key = existingKey || entryKey(dateISO, h, m);
    const existing = data[key] || null;
    modalCtx = { key:key, dateISO:dateISO, hour:h, minute:m, dateObj:dateObj, dayName: dateObj.toLocaleDateString('en-IN',{weekday:'short'}) };

    modalTitle.textContent = existing ? 'Edit lecture' : 'Add lecture';
    lecInput.value = existing ? existing.lecture : '';
    notesInput.value = existing ? (existing.notes || '') : '';
    activeSubj = existing ? existing.subject : null;
    activeType = existing ? existing.type : 'live';
    errMsg.textContent = '';
    deleteBtn.classList.toggle('hidden', !existing);

    renderSubjRow();
    [...typeRow.children].forEach(function(b){ b.classList.toggle('active', b.dataset.t===activeType); });
    setDuration(existing ? (existing.durationMin||60) : 60);

    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    lecInput.focus();
  }

  function closeModal(){
    overlay.classList.remove('open');
    if(!subjOverlay.classList.contains('open')) document.body.style.overflow = '';
    modalCtx = null;
  }

  function renderSubjList(){
    const el = document.getElementById('subjList');
    el.innerHTML = allSubjects().map(function(s){
      const isBuiltin = BUILTIN_SUBJECTS.some(function(b){ return b.id===s.id; });
      return '<div class="subj-list-row"><span class="dot" style="background:'+s.color+'"></span><span class="nm">'+escapeHtml(s.name)+'</span>'
        + (isBuiltin ? '<span class="tag">Default</span>' : '<button class="rm" data-id="'+s.id+'" aria-label="Remove subject">×</button>')
        + '</div>';
    }).join('');
  }
  function renderColorPicker(){
    const el = document.getElementById('colorPicker');
    el.innerHTML = SUBJECT_PALETTE.map(function(c){
      return '<span class="color-swatch'+(c===pickedColor?' picked':'')+'" data-c="'+c+'" style="background:'+c+'; color:'+c+';"></span>';
    }).join('');
  }
  function openSubjModal(){
    pickedColor = nextPaletteColor();
    document.getElementById('newSubjName').value = '';
    renderSubjList();
    renderColorPicker();
    subjOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeSubjModal(){
    subjOverlay.classList.remove('open');
    if(!overlay.classList.contains('open')) document.body.style.overflow = '';
    renderSubjRow();
    render(false);
  }

  subjRow.addEventListener('click', function(ev){
    const addBtn = ev.target.closest('.subj-add-btn');
    if(addBtn){ openSubjModal(); return; }
    const btn = ev.target.closest('.subj-btn'); if(!btn) return;
    activeSubj = btn.dataset.s;
    [...subjRow.querySelectorAll('.subj-btn')].forEach(function(b){ b.classList.toggle('active', b===btn); });
  });
  typeRow.addEventListener('click', function(ev){
    const btn = ev.target.closest('.type-btn'); if(!btn) return;
    activeType = btn.dataset.t;
    [...typeRow.children].forEach(function(b){ b.classList.toggle('active', b===btn); });
  });
  durChips.addEventListener('click', function(ev){
    const btn = ev.target.closest('.dur-chip'); if(!btn) return;
    setDuration(parseInt(btn.dataset.d,10));
  });

  document.getElementById('saveBtn').addEventListener('click', function(){
    if(!modalCtx) return;
    const lecture = lecInput.value.trim();
    errMsg.textContent = '';

    if(!lecture){ lecInput.style.borderColor = 'var(--danger)'; errMsg.textContent = 'Enter a topic name.'; return; }
    lecInput.style.borderColor = '';
    if(!activeSubj){ errMsg.textContent = 'Pick a subject.'; return; }

    const startSlot = hmToSlot(modalCtx.hour, modalCtx.minute);
    const span = Math.ceil(activeDur/30);
    const endTotalMin = modalCtx.hour*60+modalCtx.minute+activeDur;
    if(endTotalMin > END_HOUR*60){
      errMsg.textContent = 'That runs past 10 PM — pick an earlier start or shorter duration.';
      return;
    }

    const dayDates = [];
    for(let i=0;i<7;i++) dayDates.push(addDays(weekStart,i));
    const occ = buildOccupancy(dayDates);
    const dayIdx = dayDates.findIndex(function(d){ return isoDate(d)===modalCtx.dateISO; });
    for(let s=startSlot; s<startSlot+span; s++){
      const o = occ[dayIdx] ? occ[dayIdx][s] : null;
      if(o && o.key !== modalCtx.key){
        errMsg.textContent = 'That overlaps another lecture already scheduled.';
        return;
      }
    }

    const existing = data[modalCtx.key];
    data[modalCtx.key] = {
      subject: activeSubj,
      lecture: lecture,
      type: activeType,
      durationMin: activeDur,
      notes: notesInput.value.trim().slice(0,300),
      watched: existing ? existing.watched : false
    };
    persist();
    closeModal();
    render(false);
  });

  deleteBtn.addEventListener('click', function(){
    if(!modalCtx) return;
    delete data[modalCtx.key];
    persist(); closeModal(); render(false);
  });

  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', function(ev){ if(ev.target===overlay) closeModal(); });

  subjOverlay.addEventListener('click', function(ev){ if(ev.target===subjOverlay) closeSubjModal(); });
  document.getElementById('subjCloseBtn').addEventListener('click', closeSubjModal);
  document.getElementById('colorPicker').addEventListener('click', function(ev){
    const sw = ev.target.closest('.color-swatch'); if(!sw) return;
    pickedColor = sw.dataset.c;
    renderColorPicker();
  });
  document.getElementById('addSubjBtn').addEventListener('click', function(){
    const nameInput = document.getElementById('newSubjName');
    const name = nameInput.value.trim();
    if(!name) { nameInput.focus(); return; }
    addSubject(name, pickedColor || nextPaletteColor());
    nameInput.value = '';
    pickedColor = nextPaletteColor();
    renderSubjList();
    renderColorPicker();
  });
  document.getElementById('subjList').addEventListener('click', function(ev){
    const btn = ev.target.closest('.rm'); if(!btn) return;
    removeSubject(btn.dataset.id);
    renderSubjList();
  });
  document.getElementById('manageSubjBtn').addEventListener('click', openSubjModal);

  document.addEventListener('keydown', function(ev){
    if(ev.key!=='Escape') return;
    if(subjOverlay.classList.contains('open')) closeSubjModal();
    else if(overlay.classList.contains('open')) closeModal();
  });

  document.getElementById('prevWeek').addEventListener('click', function(){ flipWeek(-1); });
  document.getElementById('nextWeek').addEventListener('click', function(){ flipWeek(1); });
  document.getElementById('jumpToday').addEventListener('click', function(){ weekStart = getMonday(new Date()); render(true); });

  document.getElementById('exportBtn').addEventListener('click', function(){
    const payload = { version: 2, entries: data, subjects: customSubjects };
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'lecture-register-backup.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  const fileInput = document.getElementById('fileInput');
  document.getElementById('importBtn').addEventListener('click', function(){ fileInput.click(); });
  fileInput.addEventListener('change', function(){
    const file = fileInput.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      try{
        const parsed = JSON.parse(e.target.result);
        if(parsed && typeof parsed==='object' && parsed.entries){
          data = parsed.entries || {};
          customSubjects = Array.isArray(parsed.subjects) ? parsed.subjects : [];
        } else {
          data = parsed || {};
        }
        persist(); saveSubjects(); render(true);
      }
      catch(err){ alert('Could not read that file. Make sure it\'s a backup exported from this tool.'); }
    };
    reader.readAsText(file);
    fileInput.value = '';
  });

  setInterval(function(){ render(false); }, 60000);
  render(true);
  setTimeout(checkLiveNowAlert, 700);

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible'){
      render(false);
      checkLiveNowAlert();
    }
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
